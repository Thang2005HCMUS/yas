backend:
  image:
    repository: ghcr.io/thang2005hcmus/yas-order
    tag: sha-d48fc80f3319c2159c215370fe5d6b8521687fc6

  nameOverride: order
  fullnameOverride: order
  databaseName: order
  ingress:
    enabled: false
  extraVolumes:
    - name: order-application-config
      configMap:
        name: order-application-configmap
  extraVolumeMounts:
    - name: order-application-config
      mountPath: /opt/yas/order
  extraApplicationConfigPaths:
    - /opt/yas/order/order-application.yaml  