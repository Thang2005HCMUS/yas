backend:
  image:
    repository: ghcr.io/thang2005hcmus/yas-cart
    tag: sha-d48fc80f3319c2159c215370fe5d6b8521687fc6

  nameOverride: cart
  fullnameOverride: cart
  databaseName: cart
  ingress:
    enabled: false
  extraVolumes:
    - name: cart-application-config
      configMap:
        name: cart-application-configmap
  extraVolumeMounts:
    - name: cart-application-config
      mountPath: /opt/yas/cart
  extraApplicationConfigPaths:
    - /opt/yas/cart/cart-application.yaml
