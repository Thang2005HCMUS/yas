apiVersion: apps/v1
kind: Deployment
metadata:
  name: yas-fault
  namespace: yas
  labels:
    app: yas-fault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yas-fault
  template:
    metadata:
      labels:
        app: yas-fault
    spec:
      containers:
        - name: httpbin
          image: kennethreitz/httpbin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: yas-fault
  namespace: yas
  labels:
    app: yas-fault
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: yas-fault
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: yas-fault-retry
  namespace: yas
spec:
  hosts:
    - yas-fault.yas.svc.cluster.local
    - yas-fault
  http:
    - route:
        - destination:
            host: yas-fault.yas.svc.cluster.local
            port:
              number: 80
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,gateway-error,connect-failure,refused-stream
