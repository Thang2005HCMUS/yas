name: storefront-bff CI GitOps

on:
  push:
    branches: ["**"]
    paths:
      - "storefront-bff/**"
      - "common-library/**"
      - "pom.xml"
      - "generate_ci1.py"
      - ".github/workflows/storefront-bff-ci.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "storefront-bff/**"
      - "common-library/**"
      - "pom.xml"
      - "generate_ci1.py"
      - ".github/workflows/storefront-bff-ci.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storefront-bff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build storefront-bff
        run: mvn clean package -pl storefront-bff -am

      - name: Test storefront-bff
        run: mvn test -pl storefront-bff -am


      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./storefront-bff
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/yas-storefront-bff:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Update Helm image for ArgoCD
        if: github.event_name == 'push'
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/yas-storefront-bff
          IMAGE_TAG: ${{ github.sha }}
          VALUES_FILE: k8s/charts/storefront-bff/values.yaml
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          values_file = Path(os.environ["VALUES_FILE"])
          repository = os.environ["IMAGE_REPOSITORY"]
          tag = os.environ["IMAGE_TAG"]
          lines = values_file.read_text(encoding="utf-8").splitlines(keepends=True)

          image_indent = None
          repository_updated = False
          tag_updated = False
          for index, line in enumerate(lines):
              stripped = line.strip()
              indent = len(line) - len(line.lstrip())
              if image_indent is None:
                  if stripped == "image:":
                      image_indent = indent
                  continue
              if stripped and indent <= image_indent:
                  break
              if stripped.startswith("repository:"):
                  lines[index] = f"{' ' * indent}repository: {repository}\n"
                  repository_updated = True
              elif stripped.startswith("tag:"):
                  lines[index] = f"{' ' * indent}tag: \"{tag}\"\n"
                  tag_updated = True

          if not (repository_updated and tag_updated):
              raise SystemExit(f"Could not update image.repository and image.tag in {values_file}")
          values_file.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Commit Helm manifest change
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
          VALUES_FILE: k8s/charts/storefront-bff/values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          if git diff --cached --quiet; then
            echo "Helm values already use image tag $IMAGE_TAG"
            exit 0
          fi
          git commit -m "chore(gitops): deploy storefront-bff $IMAGE_TAG [skip ci]"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto origin/${GITHUB_REF_NAME}"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo "Unable to push the Helm manifest update after 3 attempts"
          exit 1
