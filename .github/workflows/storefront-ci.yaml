name: storefront service ci

on:
  push:
    branches: ["**"]
    paths:
      - "storefront/**"
      - ".github/workflows/storefront-ci.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "storefront/**"
      - ".github/workflows/storefront-ci.yaml"
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  pull-requests: write
  packages: write

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: storefront

      - name: Build application
        run: npm run build
        working-directory: storefront

  Test:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: storefront

      - name: Run tests if present
        run: npm test --if-present
        working-directory: storefront

      - name: Run lint
        run: npm run lint
        working-directory: storefront

      - name: Check formatting
        run: npx prettier --check .
        working-directory: storefront

  Docker:
    needs: [Build, Test]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: yas-storefront
      IMAGE_TAG: sha-${{ github.sha }}
      VALUES_FILE: k8s/charts/storefront-ui/values.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set image repository
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_REPOSITORY=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./storefront
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}:latest

      - name: Update Helm image repository and tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["VALUES_FILE"])
          repository = os.environ["IMAGE_REPOSITORY"]
          tag = os.environ["IMAGE_TAG"]
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          in_image = False
          image_indent = None
          updates = {"repository": repository, "tag": tag}
          updated = set()

          for index, line in enumerate(lines):
              stripped = line.strip()
              indent = len(line) - len(line.lstrip())

              if stripped == "image:":
                  in_image = True
                  image_indent = indent
                  continue

              if not in_image:
                  continue

              if stripped and indent <= image_indent:
                  in_image = False
                  image_indent = None
                  continue

              for key, value in updates.items():
                  if stripped.startswith(key + ":"):
                      prefix = line[:indent]
                      newline = "\r\n" if line.endswith("\r\n") else "\n" if line.endswith("\n") else ""
                      lines[index] = prefix + key + ": " + value + newline
                      updated.add(key)
                      break

              if updated == set(updates):
                  break

          missing = updates.keys() - updated
          if missing:
              raise SystemExit("Could not find image." + ",".join(sorted(missing)) + " in " + str(path))

          path.write_text("".join(lines), encoding="utf-8")
          print("Updated " + str(path) + " image to " + repository + ":" + tag)
          PY

      - name: Commit updated image repository and tag
        run: |
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"

          if git diff --quiet -- "$VALUES_FILE"; then
            echo "No Helm values change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "ci: update storefront image to $IMAGE_REPOSITORY:$IMAGE_TAG"

          for attempt in 1 2 3; do
            if git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push failed, rebasing and retrying ($attempt/3)."
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep $((attempt * 5))
          done

          exit 1

  SonarCloud:
    needs: [Build, Test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        id: sonar
        uses: SonarSource/sonarcloud-github-action@v5
        with:
          projectBaseDir: storefront
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Summary
        if: always()
        run: |
          if [ "${{ steps.sonar.outcome }}" = "success" ]; then STATUS="PASS"; else STATUS="FAIL"; fi
          echo "## SonarCloud Report: storefront" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | **$STATUS** |" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Storefront |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
