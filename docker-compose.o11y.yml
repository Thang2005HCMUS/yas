x-default-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

x-default-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  # ********************
  # Telemetry Components
  # ********************
  # OpenTelemetry Collector
  collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: collector
    hostname: ${OTEL_COLLECTOR_HOST:-collector}
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 125M
    restart: unless-stopped
    command: [ "--config=/etc/otelcol-config.yml","--feature-gates=pkg.translator.prometheus.NormalizeName"]
    volumes:
      - ./docker/otel-collector/otelcol-config.yml:/etc/otelcol-config.yml:ro
    ports:
      - "${OTEL_COLLECTOR_PORT_GRPC:-5555}:5555" # OTLP over gRPC receiver
      - "${OTEL_COLLECTOR_PORT_HTTP:-6666}:6666" # OTLP over HTTP receiver
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-config.yml" ]
    logging: *logging
    networks:
      - yas-network
  prometheus:
    image: prom/prometheus:v2.42.0
    hostname: ${PROMETHEUS_SERVICE_HOST:-prometheus}
    container_name: prometheus
    command:
      - --web.console.templates=/etc/prometheus/consoles
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=1h
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.route-prefix=/
      - --enable-feature=exemplar-storage
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_SERVICE_PORT:-9090}:9090"
    healthcheck:
      <<: *healthcheck
      test: wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1
    logging: *logging
    networks:
      - yas-network
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    hostname: ${GRAFANA_SERVICE_HOST:-grafana}
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_METRICS_ENABLED=true
    ports:
      - "${GRAFANA_SERVICE_PORT:-3000}:3000"
    healthcheck:
      <<: *healthcheck
      test: wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1
    logging: *logging
    networks:
      - yas-network
  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    hostname: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki/loki-local.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      <<: *healthcheck
      test: wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1
    logging: *logging
    networks:
      - yas-network
  tempo:
    image: grafana/tempo:1.5.0
    container_name: tempo
    hostname: tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml", "-search.enabled=true"]
    volumes:
      - ./docker/tempo/tempo-local.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"
      # - "14268:14268"  # jaeger ingest
      # - "9411:9411" # zipkin
      - "4317:4317" # otlp grpc ingest
      - "4318:4318" # otlp http ingest
    healthcheck:
      <<: *healthcheck
      test: wget --no-verbose --tries=1 --spider http://localhost:3200/status || exit 1
    logging: *logging
    networks:
      - yas-network
networks:
  yas-network:
    name: yas-network

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
