global:
  scrape_interval: 2s
  evaluation_interval: 2s
  external_labels:
    environment: yas-local

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - collector:8888

  - job_name: prometheus
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200
